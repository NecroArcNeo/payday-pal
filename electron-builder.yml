# Windows installer for the desktop app: npm run dist:win (output in release/).
appId: com.meridian.payroll
productName: Meridian Payroll
copyright: Copyright © 2026 NecroArcNeo
directories:
  output: release
  buildResources: build
files:
  - electron/**
  - dist/client/**
  - build/icon.ico
  # The pages are already bundled into dist/client; the main process only needs SQLite (SQLCipher).
  - "!node_modules/**"
  - node_modules/better-sqlite3-multiple-ciphers/package.json
  - node_modules/better-sqlite3-multiple-ciphers/lib/**
  - node_modules/better-sqlite3-multiple-ciphers/prebuilds/win32-x64.node
# A native module is loaded from a real file, not from inside the app archive.
asarUnpack:
  - node_modules/better-sqlite3-multiple-ciphers/**
win:
  target: nsis
  icon: build/icon.ico
nsis:
  # Installs for this Windows user only: no administrator prompt, no "allow changes" dialog.
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Meridian Payroll
  # Uninstalling never deletes the payroll database or the backups.
  deleteAppDataOnUninstall: false
# Chromium's own interface text (context menus, spell-check): English only keeps ~45 MB out of the install.
electronLanguages:
  - en-US
